[project]
name = "nrim"
version = "0.1.0"
description = "Standalone Network Reliability Intelligence Model research implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=49.0.0,<50.0.0",
    "fastapi>=0.139.2,<0.140.0",
    "pydantic>=2.13.4,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]

